<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1a1a2e">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Learn obscure and beautiful English words, one day at a time.">
  <title>Just Words</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Screen: Welcome -->
    <div class="screen active" id="screen-welcome">
      <div class="screen-content centered">
        <h1 class="brand">Just Words</h1>
        <p class="subtitle">Learn obscure &amp; beautiful English words,<br>one day at a time.</p>
        <button class="btn primary" id="btn-start">Get Started</button>
      </div>
    </div>

    <!-- Screen: Assessment -->
    <div class="screen" id="screen-assess">
      <div class="screen-content">
        <div class="progress-bar"><div class="progress-fill" id="assess-progress"></div></div>
        <p class="assess-label">Do you know this word?</p>
        <h2 class="assess-word" id="assess-word"></h2>
        <div class="assess-actions">
          <button class="btn outline" id="btn-dont-know">Nope</button>
          <button class="btn primary" id="btn-know">I know it</button>
        </div>
        <p class="assess-hint" id="assess-hint"></p>
      </div>
    </div>

    <!-- Screen: Preferences -->
    <div class="screen" id="screen-prefs">
      <div class="screen-content centered">
        <h2 class="section-title">Your Level</h2>
        <p class="level-result" id="level-result"></p>
        <h2 class="section-title" style="margin-top:2rem;">Words Per Week</h2>
        <div class="pace-options">
          <button class="pace-btn" data-pace="10">10<span>~1-2/day</span></button>
          <button class="pace-btn selected" data-pace="20">20<span>~3/day</span></button>
          <button class="pace-btn" data-pace="30">30<span>~4-5/day</span></button>
        </div>
        <button class="btn primary" id="btn-go" style="margin-top:2.5rem;">Start Learning</button>
      </div>
    </div>

    <!-- Screen: Today's Words -->
    <div class="screen" id="screen-today">
      <div class="screen-content">
        <header class="today-header">
          <h2 class="today-title">Today's Words</h2>
          <button class="icon-btn" id="btn-settings" aria-label="Settings">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          </button>
        </header>
        <div class="word-list" id="word-list"></div>
        <div class="empty-state" id="empty-state" style="display:none;">
          <p>You've seen all your words for today.</p>
          <p class="muted">Come back tomorrow for more.</p>
        </div>
      </div>
    </div>

    <!-- Screen: Word Detail -->
    <div class="screen" id="screen-detail">
      <div class="screen-content">
        <button class="back-btn" id="btn-back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>
        <div id="detail-content"></div>
      </div>
    </div>

    <!-- Screen: Settings -->
    <div class="screen" id="screen-settings">
      <div class="screen-content">
        <button class="back-btn" id="btn-back-settings">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Back
        </button>
        <h2 class="section-title">Settings</h2>
        <div class="settings-group">
          <label class="settings-label">Words per week</label>
          <div class="pace-options">
            <button class="pace-btn" data-pace="10">10</button>
            <button class="pace-btn" data-pace="20">20</button>
            <button class="pace-btn" data-pace="30">30</button>
          </div>
        </div>
        <div class="settings-group">
          <label class="settings-label">Progress</label>
          <p class="settings-stat" id="stat-learned"></p>
        </div>
        <div class="settings-group">
          <button class="btn outline danger" id="btn-reset">Reset Everything</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js');
    }
  </script>
</body>
</html>
